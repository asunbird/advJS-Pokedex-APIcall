<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>Advansed Pokedex</title>
  </head>
  <body>
    <!-- Dot background for this page-->
    <div id="dot-bg"></div>

    <!-- Page heading and logo -->
    <div id="heading">
      <div id="logo-heading">
        <img id="logo" src="media/pokeball.PNG" alt="pokeball">
        <h1>PokéBench</h1>
      </div>
      <h3>Catch some Pokemons to your board</h3>
    </div>

    <!-- Buttons for generating Pokemon cards -->
    <section id="gen-buttons">
        <!-- Generate button (1 page with 30 Pokemon cards) -->
        <div id="autogen">
            <input id="autogenBtn" type="button" value="Auto Generate 30 Pokemons" />
        </div>
    
        <!-- Searching and Adding a pokemon -->
        <div id="search-add"> 
            <!-- Search field where users will search for Pokemon’s name or id. -->
            <input id="name-id" type="text" placeholder="Pokemon name or id" required />
            <!-- Search button -->
            <input id="searchAddBtn" type="button" value="Search & Add" />
        </div>
    </section>


    <!-- Pokemon's Cards container with Search filter -->
    <div id="pokedex">
      <div id="filter-section">
        <!-- Search filter UI inside this section -->
        <h3>Search filter inside your board</h3>
        <div id="search-filter">
          <input id="search-filter-input" type="text" placeholder="Search Pokemon name or id" />
          <input id="search-filter-btn" type="button" value="Search" />
        </div>
      </div>

      <!-- Pokemon's Cards container -->
      <ul id="pokedex-cards"></ul> <!-- Use an <ul> for the list of card items! -->   

      <div id="pagination"></div>
    </div>

    <!-- Footer -->
    <footer id="footer">
      <span>© 2026 <a href="https://github.com/asunbird" target="_blank">asunbird</a> | Pokedex v2 - API call</span>
    </footer>

    <script src="src/script.js"></script>
  </body>
</html>
