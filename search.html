<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>Advansed Pokedex</title>
  </head>
  <body>
    <div id="dot-bg"></div>
    <div id="heading">
      <h1>"PokéBench"</h1>
      <h3>Catch some Pokemons to your board</h3>
    </div>
    <div id="autogen">
      <input id="autogenBtn" type="button" value="Auto Generate" />
    </div>
    <div id="search">
      <!-- Searching a pokemon -->
      <!-- Search field where users will search for Pokemon’s name or id. -->
        <input id="name-id" type="text" placeholder="Pokemon name or id" required />

        <input id="searchBtn" type="button" value="Search" />
    </div>
    <div id="pokedex"></div>

    <script src="src/script.js"></script>
  </body>
</html>
