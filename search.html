<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>Advansed Pokedex</title>
  </head>
  <body>
    <!-- Dot background for this page-->
    <div id="dot-bg"></div>

    <div id="heading">
      <h1>"PokéBench"</h1>
      <h3>Catch some Pokemons to your board</h3>
    </div>

    <!-- Generate button (1 page with 30 Pokemon cards) -->
    <div id="autogen">
      <input id="autogenBtn" type="button" value="Auto Generate 30 Pokemons" />
    </div>
    
    <!-- Searching a pokemon -->
    <div id="search"> 
        <!-- Search field where users will search for Pokemon’s name or id. -->
        <input id="name-id" type="text" placeholder="Pokemon name or id" required />
        <!-- Search button -->
        <input id="searchBtn" type="button" value="Search" />
    </div>

    <!-- Pokemon's Cards container-->
    <div id="pokedex"></div>

    <!-- Footer -->
    <footer id="footer">
      <span>© 2026 asunbird | Pokedex v2 - API call</span>
    </footer>

    <script src="src/script.js"></script>
  </body>
</html>
